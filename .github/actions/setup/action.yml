name: Setup toolchain
description: Bun and Node from mise.toml, the other mise.toml tools a job asks for, and the caches every job in this repo needs.

inputs:
  tools:
    description: Extra mise.toml tools to install next to bun and node, space-separated (e.g. "rust").
    required: false
    default: ''
  rust-targets:
    description: Extra rustup targets, space separated. Needs "rust" in tools.
    required: false
    default: ''
  cache-key:
    description: Suffix that keeps the Rust cache separate per platform or job. Needs "rust" in tools.
    required: false
    default: ''

runs:
  using: composite

  steps:
    # mise's shims would install any other mise.toml tool the moment a shimmed command runs, through the
    # GitHub API without a token (60 requests an hour per runner IP). A job installs exactly the tools it
    # asks for below; the token goes to mise-action only, never to the job's environment.
    - name: Configure mise
      shell: bash
      run: |
        {
          echo "MISE_AUTO_INSTALL=false"
          echo "MISE_EXEC_AUTO_INSTALL=false"
          echo "MISE_NOT_FOUND_AUTO_INSTALL=false"
        } >> "$GITHUB_ENV"

    # mise.toml is the one place the toolchain is pinned, so CI and a local `mise install` run the same
    # versions. mise-action caches its install dir keyed by mise.toml and install_args.
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install_args: bun node ${{ inputs.tools }}
        github_token: ${{ github.token }}

    # rustup applies the targets to the toolchain mise activated (RUSTUP_TOOLCHAIN).
    - name: Add the Rust targets
      if: contains(inputs.tools, 'rust') && inputs.rust-targets != ''
      shell: bash
      run: rustup target add ${{ inputs.rust-targets }}

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      if: contains(inputs.tools, 'rust')
      with:
        workspaces: apps/client/native
        key: ${{ inputs.cache-key }}
        cache-on-failure: true

    - name: Cache bun packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # The server's postinstall runs `prisma generate`, and prisma.config.ts
    # resolves DIRECT_URL through env(), which throws when unset. `generate`
    # never connects, so a placeholder satisfies it — the same trick the
    # Dockerfiles use.
    - name: Install dependencies
      shell: bash
      env:
        DATABASE_URL: postgresql://placeholder
        DIRECT_URL: postgresql://placeholder
      run: bun install --frozen-lockfile
