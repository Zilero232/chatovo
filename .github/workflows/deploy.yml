name: deploy

# Builds the web, site and server images, pushes them to ghcr, then tells the VPS to pull and
# restart. The VPS has no clone of the repo, so docker-compose.yml is copied
# on every deploy.
#
# Secrets — Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_API_URL       baked into the web image at build time
#   NEXT_PUBLIC_APP_URL       likewise (web and site), the app host e.g. https://app.chatovo.ru
#   NEXT_PUBLIC_LIVEKIT_URL   likewise
#   SSH_HOST                  production VPS
#   SSH_USER
#   SSH_PRIVATE_KEY           private key used for scp + ssh
#   SSH_PORT                  optional, defaults to 22
#   DEPLOY_PATH               where docker-compose.yml lives, e.g. /opt/chatovo
#
# Actions are pinned to a SHA, not a tag: a moved tag would run unknown code
# against production.
on:
  workflow_dispatch:

# Never cancel a half-finished deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

# prisma.config.ts resolves DIRECT_URL through env(), which throws when unset —
# a `bun install` added here later would trip on it.
env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

permissions: {}

jobs:
  # The three images are independent, so they build in parallel.
  images:
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        image: [web, site, server]

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # ghcr rejects capitals in an image name; the owner has them.
      - name: Lowercase the image prefix
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Secrets are not available to the matrix itself, so every image gets the
      # same NEXT_PUBLIC_* set; each Dockerfile declares only the ARGs it uses.
      - name: Build and push the ${{ matrix.image }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/chatovo-${{ matrix.image }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  vps:
    needs: images

    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}

      # DEPLOY_PATH travels as an env var: interpolating an expression into a
      # shell body is how injection gets in.
      - name: Pull and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            docker compose pull web site server
            # Migrations run before the new code serves traffic. db:baseline
            # covers the pre-migration schema (P3005) and is a no-op after.
            docker compose run --rm --no-deps server bun db:baseline
            docker compose run --rm --no-deps server bun db:deploy
            docker compose up -d
            docker image prune -f

            # `up -d` returns when the container starts, not when the app
            # answers — wait for the compose healthcheck instead.
            for service in server site; do
              for attempt in $(seq 1 30); do
                state=$(docker inspect -f '{{.State.Health.Status}}' "chatovo-$service" 2>/dev/null || echo missing)

                [ "$state" = healthy ] && break

                if [ "$attempt" = 30 ]; then
                  echo "$service never became healthy (last state: $state)" >&2
                  docker compose logs --tail 50 "$service" >&2
                  exit 1
                fi

                sleep 5
              done
            done
