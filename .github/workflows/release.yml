name: release

# Ships one version everywhere: desktop installers to a GitHub Release, and the
# signed Android bundle attached to it and uploaded to Google Play.
#
#   checks ─ draft ─┬─ desktop ──────────────┬─ publish
#                   └─ android ──────────────┘
#
# Push a `v*` tag to release everything; a manual run takes a `targets` choice
# (all / desktop / android) to rebuild one platform without paying for the
# other. Either way the tag comes from the root package.json, and the release is
# appended to rather than replaced. The aab goes to the Play track named by the
# PLAY_TRACK variable (production when unset) and is sent for review; Google
# publishes it once moderation passes. Its "What's new" is the version's entry
# in apps/client/views/changelog/config/releases.ts, in Russian and English.
#
# Secrets — Settings → Secrets and variables → Actions. GITHUB_TOKEN is
# provided by Actions.
#
#   Both platforms
#     NEXT_PUBLIC_API_URL        baked into every bundle, e.g. https://api.chatovo.ru
#     NEXT_PUBLIC_LIVEKIT_URL    likewise, e.g. wss://livekit.chatovo.ru
#
#   Desktop — updater signing
#     TAURI_SIGNING_PRIVATE_KEY  contents of ~/.tauri/chatovo.key
#                                (bun --filter @chatovo/tauri signer:generate)
#
#   Android — apk/aab signing, used by the `android` job
#     ANDROID_KEY_ALIAS          keystore alias
#     ANDROID_KEY_PASSWORD       keystore + key password
#     ANDROID_KEY_BASE64         the keystore itself, base64
#
#   Android — Google Play upload, skipped while unset
#     PLAY_SERVICE_ACCOUNT_JSON  the service account key (JSON) with release
#                                rights on the app in Play Console
#
# Variables — the same page, Variables tab.
#
#   PLAY_TRACK                   production (default), beta, alpha or internal
#
# The Android keystore is the Play *upload* key: Play App Signing holds the app
# key and re-signs every release, so this one can be rotated from the Console if
# it ever leaks.
#
#   keytool -genkey -v -keystore chatovo-release.keystore -alias chatovo \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -i chatovo-release.keystore
#
# Actions are pinned to a commit SHA, not a tag: a tag can be moved, and these
# jobs hold the signing keys.

on:
  # `workflow_run` cannot filter on a tag; hence the `checks` job, not a chain.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: which platforms to build (a tag push always builds all)
        type: choice
        default: all
        options: [all, desktop, android]

# The server postinstall runs prisma generate, which resolves DIRECT_URL through
# env() but never connects — placeholders are fine.
env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

# Granted per job: only the ones touching the release need write.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate: a tag on a commit that does not pass never produces signed artefacts.
  checks:
    # The root `permissions: {}` strips every scope; the clone needs this back.
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Root package.json owns the version; per-app manifests stay at 0.0.0.
      - name: Check the tag matches the version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          root=$(node -p "require('./package.json').version")

          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$root" ]; then
            echo "tag $REF_NAME does not match root package.json version $root" >&2
            exit 1
          fi

          echo "releasing v$root"

      - uses: ./.github/actions/setup
        with:
          tools: rust caddy
          cache-key: verify

      # tauri links against webkit2gtk; clippy cannot build without these.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      # frontendDist is validated at build time: icons and the exported client
      # must exist before clippy touches the crate.
      - run: bun run tauri:icon

      # Nothing built here ships; placeholders keep this runnable on a fork.
      - name: Build the client
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.invalid
          NEXT_PUBLIC_LIVEKIT_URL: wss://livekit.invalid
        run: bun --filter @chatovo/client build

      - run: bun run verify
      - run: bun run test
      - run: bun run lint:rust
      - run: bun run lint:caddy

  draft:
    needs: checks

    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITISH: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"

          gh release view "$tag" >/dev/null 2>&1 && exit 0

          gh release create "$tag" --draft --target "$COMMITISH" \
            --title "Chatovo $tag" --notes ""

  # Tauri cannot cross-compile, so every platform builds on its own runner.
  # tauri-action merges each entry into one latest.json — no hand-rolled manifest.
  desktop:
    needs: draft
    if: github.event_name == 'push' || contains(fromJSON('["all", "desktop"]'), inputs.targets)

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows
            args: ''
          # Separate bundles per arch: the updater keys its platforms on it.
          - os: macos-15
            label: macos-aarch64
            args: --target aarch64-apple-darwin
          - os: macos-15
            label: macos-x86_64
            args: --target x86_64-apple-darwin
          - os: ubuntu-24.04
            label: linux
            args: ''

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: rust
          cache-key: ${{ matrix.label }}
          # mise.toml pins the toolchain only; a mac runner builds the other arch too.
          rust-targets: ${{ matrix.label == 'macos-aarch64' && 'aarch64-apple-darwin' || matrix.label == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      # tauri-action builds the client itself; icons it does not generate.
      - run: bun run tauri:icon

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/tauri
          tagName: v__VERSION__
          releaseName: Chatovo v__VERSION__
          # Stays a draft until Android has uploaded too; `publish` flips it.
          releaseDraft: true
          args: ${{ matrix.args }}

  # Attaches the signed aab to the draft release and uploads it to Play.
  android:
    needs: draft
    if: github.event_name == 'push' || contains(fromJSON('["all", "android"]'), inputs.targets)

    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      # No `cache: gradle` on setup-java: it hashes **/*.gradle*, which does not
      # exist until `tauri android init` runs below. The key tracks the overlay
      # scripts instead, since they rewrite the build files.
      - name: Cache gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/tauri/Cargo.toml', 'apps/tauri/scripts/setup-android-fcm.mjs', '') }}
          restore-keys: gradle-

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      # setup-android ships the SDK but not the NDK, which cargo needs to
      # cross-compile to the android targets. r28+ links 16 KB aligned by
      # default, which Play requires (apps/tauri/.cargo/config.toml pins it too).
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: r28c

      - uses: ./.github/actions/setup
        with:
          tools: rust
          cache-key: android
          rust-targets: aarch64-linux-android x86_64-linux-android

      # Play's "What's new" comes from the changelog entry of this version; a
      # release without one fails here, before the long build.
      - name: Write the Play release notes
        run: bun apps/client/scripts/write-play-release-notes.ts target/whatsnew

      # `tauri android init` regenerates gen/android from scratch: overlays and
      # signing config go after it, never before.
      - name: Prepare the android project
        working-directory: apps/tauri
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          bunx tauri android init
          bun run icon
          node ./scripts/setup-android-fcm.mjs

      - name: Wire release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: node apps/tauri/scripts/android-signing.mjs

      # Only the aab: Play derives the per-device apks from it.
      - name: Build the aab
        working-directory: apps/tauri
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
        run: bunx tauri android build --aab --target aarch64 --target x86_64

      - name: Collect the aab
        id: artifacts
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          gen=apps/tauri/gen/android
          aab=$(find "$gen" -path '*/outputs/*' -name '*release*.aab' | head -1)

          if [ -z "$aab" ]; then
            echo "aab missing under $gen" >&2
            exit 1
          fi

          mkdir -p target/android-release
          cp "$aab" "target/android-release/Chatovo_${version}_android.aab"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.artifacts.outputs.tag }}
        run: gh release upload "$TAG" target/android-release/* --clobber

      # A step's `if` can't read secrets, hence the probe.
      - name: Check for Play credentials
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "enabled=${PLAY_SERVICE_ACCOUNT_JSON:+true}" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: chatovo.app
          releaseFiles: target/android-release/*.aab
          releaseName: ${{ steps.artifacts.outputs.tag }}
          track: ${{ vars.PLAY_TRACK || 'production' }}
          whatsNewDirectory: target/whatsnew
          status: completed

  publish:
    needs: [desktop, android]
    # Nothing failed, and something actually built. A `skipped` job is a
    # deliberate `targets` choice, so it must not block.
    if: >-
      always()
      && needs.desktop.result != 'failure'
      && needs.android.result != 'failure'
      && (needs.desktop.result == 'success' || needs.android.result == 'success')

    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          gh release edit "$tag" --draft=false --latest
