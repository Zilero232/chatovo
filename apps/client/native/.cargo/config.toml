# Google Play rejects 64-bit native libraries whose LOAD segments are not 16 KB aligned
# (developer.android.com/guide/practices/page-sizes). NDK r28+ links that way by default; the
# flags keep it true whatever NDK builds the lib. A `cfg` entry, not `[target.<triple>]`: the
# Tauri CLI sets CARGO_TARGET_<TRIPLE>_RUSTFLAGS itself, and cargo joins the two.
[target.'cfg(target_os = "android")']
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]
