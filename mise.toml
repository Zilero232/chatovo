# The toolchain for this repo: `mise install` in the repo root.
# Keep each pin in step with what CI and the Dockerfiles use.

min_version = "2026.9.0"

[tools]
# The only bun pin besides the oven/bun tag in apps/{client,server}/Dockerfile — bumping bun means both.
# CI installs it from here (.github/actions/setup, jdx/mise-action).
bun = "1.3.14"
# Runs the Next CLI (its bin is a node script) and the release workflow's `node` one-liners and scripts.
node = "24"
# The Tauri shell (apps/client/native). CI lints it with clippy and checks rustfmt. The per-platform targets
# (macOS arches, Android) are added by the job that needs them: `rust-targets` in .github/actions/setup.
# The JDK, the Android SDK and the NDK stay outside mise: apps/client/native/.env locally, their own actions in CI.
rust = { version = "1.95.0", components = "rustfmt,clippy" }
# Formats and validates infra/caddy/Caddyfile*: `bun run format:caddy`. Same 2.x line as the caddy:2-alpine image.
caddy = "2.11.7"
